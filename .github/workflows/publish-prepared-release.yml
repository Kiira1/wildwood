name: Publish prepared release
run-name: Publish prepared release ${{ inputs.ticket }}
on:
  workflow_dispatch:
    inputs:
      ticket:
        description: Unique release operation ID
        required: true
        type: string
      run_id:
        description: Successful Prepare release artifacts run ID
        required: true
        type: string
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate source workflow
        uses: actions/github-script@v7
        env:
          PREPARED_RUN_ID: ${{ inputs.run_id }}
        with:
          script: |
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: process.env.PREPARED_RUN_ID});
            if (run.path !== '.github/workflows/prepare-release.yml' || run.conclusion !== 'success') {
              throw new Error('A successful prepared release run is required');
            }
      - uses: actions/download-artifact@v4
        with:
          name: prepared-web
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: dist
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - uses: actions/deploy-pages@v5
        id: deployment
