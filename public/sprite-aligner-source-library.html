<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>WildStat Character Layer Aligner</title>
<link rel="icon" href="wildstat-favicon.ico" sizes="any" />
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0c1710; color: #f3f5e9; }
  body { display: grid; place-items: start center; min-height: 100vh; margin: 0; padding: 20px; }
  main { width: min(760px, 100%); }
  h1 { margin: 0 0 6px; font-size: 20px; } p { margin: 0 0 16px; color: #b9c9ba; font-size: 13px; }
  .controls { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
  label { display: grid; gap: 5px; color: #cbdaca; font-size: 12px; }
  input, select, button { font: inherit; } input, select { box-sizing: border-box; width: 100%; }
  .value { color: #8cf278; font-variant-numeric: tabular-nums; }
  canvas { display: block; width: min(100%, 720px); margin: auto; border: 2px solid #000; background: #18251a; image-rendering: pixelated; outline: none; }
  canvas:focus { border-color: #fff; }
  output { display: block; margin-top: 12px; padding: 9px; border: 1px solid #405a43; background: #101c12; color: #f8f8f8; font: 12px ui-monospace, monospace; white-space: pre-wrap; }
  button { padding: 7px 10px; border: 1px solid #000; background: #fff; color: #111; cursor: pointer; }
  .buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  @media (max-width: 620px) { .controls { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
</head>
<body>
<main>
  <h1>Character Layer Aligner</h1>
  <p>Offline source tool. Click preview, then arrow keys nudge selected layer. Shift + arrow moves 5px.</p>
  <section class="controls">
    <label>Preset / offsets<select id="character"></select></label>
    <label>Facing<select id="facing"><option value="right">RIGHT</option><option value="left">LEFT · mirrored</option></select></label>
    <label>Skin tone<select id="skinTone"></select></label>
    <label>Body source<select id="bodySource"></select></label>
    <label>Expansion helmet<select id="helmetSource"></select></label>
    <label>Expansion chest<select id="chestSource"></select></label>
    <label>Back leg source<select id="backLegSource"></select></label>
    <label>Front leg source<select id="frontLegSource"></select></label>
    <label>Layer<select id="layer"></select></label>
    <label>X from center <span id="xValue" class="value">0</span><input id="x" type="range" min="-100" max="100" value="0" /></label>
    <label>Y offset <span id="yValue" class="value">0</span><input id="y" type="range" min="-100" max="100" value="0" /></label>
    <label>Animation<select id="animation"><option value="idle">idle</option><option value="walk">walking</option></select></label>
    <label>Walk frame<select id="frame"><option value="0">idle</option><option value="1">step 1</option><option value="2">step 2</option><option value="3">step 3</option></select></label>
    <label>Projectile<select id="projectile"><option value="off">hidden</option><option value="on">show Shot.webp</option></select></label>
  </section>
  <canvas id="canvas" width="720" height="480" tabindex="0" aria-label="Character preview. Click, then use arrow keys to nudge the selected layer."></canvas>
  <output id="result">Loading character parts.</output>
  <div class="buttons"><button id="playPause" type="button" aria-pressed="true">pause walk</button><button id="resetLayer" type="button">reset layer</button><button id="copy" type="button">copy character offsets</button></div>
</main>
<script>
  const SOURCE_ROOT = "../art-source/vendor/2D Minimal Characters/PNG/character";
  const CHARACTER_IDS = Array.from({ length: 8 }, (_, index) => `character_${index + 1}`);
  const LAYERS = [
    { id: "backLeg", label: "back leg", file: "Leg2.webp", baseX: -8, anchorY: 171, anchor: "bottom", leg: -1 },
    { id: "frontLeg", label: "front leg", file: "Leg.webp", baseX: 8, anchorY: 171, anchor: "bottom", leg: 1 },
    { id: "body", label: "base body · skin tint", file: "Body.webp", anchorY: 157, anchor: "bottom", kind: "body", width: 41.4675, height: 45.315 },
    { id: "chest", label: "expansion chest · over base body", anchorY: 157, anchor: "bottom" },
    { id: "head", label: "base head · helmet anchor", file: "Head.webp", anchorY: 104, anchor: "bottom", motion: "head", kind: "head", width: 61.75, height: 40 },
    { id: "helmet", label: "expansion helmet · front of head", anchorY: 118, anchor: "bottom", motion: "head" },

  const defaults = Object.fromEntries(LAYERS.map((part) => [part.id, part.id === "head" ? { x: 0, y: 15 } : part.id === "helmet" ? { x: 0, y: 26 } : part.id === "chest" ? { x: 0, y: 11 } : { x: 0, y: 0 }]));
  const SKIN_TONES = [

    ["tan", "#ae6f48"], ["brown", "#8e5738"], ["deep brown", "#6d402a"], ["rich espresso", "#4f2d20"], ["deep umber", "#352017"],
  ];
  const HELMET_ROOT = "../art-source/vendor/2D Minimal - Character Parts Pack Vol.1 [Expansion]/Parts Pack Vol.1/Parts/Helmet";
  const CHEST_ROOT = "../art-source/vendor/2D Minimal - Character Parts Pack Vol.1 [Expansion]/Parts Pack Vol.1/Parts/Chest";
  const HELMET_FILES = "FA_Helmet_041_Dark.webp FA_Helmet_041_Gold.webp FA_Helmet_041_Gray.webp FA_Helmet_041_Green.webp FA_Helmet_042_Brown.webp FA_Helmet_042_Gray.webp FA_Helmet_042_Purple.webp FA_Helmet_043_Brown.webp FA_Helmet_043_Green.webp FA_Helmet_043_Red.webp FA_Helmet_044_Brown.webp FA_Helmet_044_Dark.webp FA_Helmet_044_White.webp FA_Helmet_045_GoldBlue.webp FA_Helmet_045_GoldRed.webp FA_Helmet_045_Purple.webp FA_Helmet_046_Gray.webp FA_Helmet_046_Mint.webp FA_Helmet_046_Red.webp FA_Helmet_047_Silver.webp FA_Helmet_047_White.webp FA_Helmet_048_Dark.webp FA_Helmet_048_Peacock.webp FA_Helmet_048_Purple.webp FA_Helmet_049_Bronze.webp FA_Helmet_049_Gold.webp FA_Helmet_049_Silver.webp FA_Helmet_050_Green.webp FA_Helmet_050_Purple.webp FA_Helmet_050_Red.webp FA_Helmet_051_Dark.webp FA_Helmet_051_Gold.webp FA_Helmet_051_Silver.webp FA_Helmet_052_Dark.webp FA_Helmet_052_Gold.webp FA_Helmet_052_Gray.webp FA_Helmet_053_Dark.webp FA_Helmet_053_DarkGreen.webp FA_Helmet_053_Purple.webp FA_Helmet_054_BronzeWine.webp FA_Helmet_054_GoldRed.webp FA_Helmet_054_SilverWhite.webp FA_Helmet_055_Brown.webp FA_Helmet_055_Dark.webp FA_Helmet_056_Dark.webp FA_Helmet_056_Gray.webp FA_Helmet_057_Brown.webp FA_Helmet_057_DarkYellow.webp FA_Helmet_058_Gold.webp FA_Helmet_058_Silver.webp FA_Helmet_059_Gold.webp FA_Helmet_059_Silver.webp FA_Helmet_060_Green.webp FA_Helmet_060_Purple.webp FA_Helmet_060_Red.webp FA_Helmet_061_Blue.webp FA_Helmet_061_Brown.webp FA_Helmet_061_Gray.webp FA_Helmet_062_Brown.webp FA_Helmet_062_Gray.webp FA_Helmet_062_Green.webp FA_Helmet_063_Brown.webp FA_Helmet_063_Gray.webp FA_Helmet_065_Dark.webp FA_Helmet_065_Gold.webp FA_Helmet_065_Gray.webp FA_Helmet_066_Gray.webp FA_Helmet_066_Pink.webp FA_Helmet_066_White.webp FA_Helmet_067_GoldBlue.webp FA_Helmet_067_GoldPurple.webp FA_Helmet_067_GoldRed.webp FA_Helmet_068_Blue.webp FA_Helmet_068_Brown.webp FA_Helmet_068_Orange.webp FA_Helmet_069_Blue.webp FA_Helmet_069_Gray.webp FA_Helmet_069_White.webp FA_Helmet_070_Green.webp FA_Helmet_070_Yellow.webp FA_Helmet_071_Brown.webp FA_Helmet_071_Gray.webp FA_Helmet_071_Red.webp FA_Helmet_072_Gray.webp FA_Helmet_072_Red.webp FA_Helmet_072_Yellow.webp FA_Helmet_073_Gold.webp FA_Helmet_073_GrayGold.webp FA_Helmet_073_Whte.webp FA_Helmet_074_Brown.webp FA_Helmet_074_Gray.webp FA_Helmet_075_DarkRed.webp FA_Helmet_075_DarkYellow.webp FA_Helmet_075_Gray.webp FA_Helmet_076_Brown.webp FA_Helmet_076_Green.webp FA_Helmet_077_Blue.webp FA_Helmet_077_Brown.webp FA_Helmet_077_Khaki.webp FA_Helmet_078_Blue.webp FA_Helmet_078_Gold.webp FA_Helmet_078_Gray.webp FA_Helmet_079_Gray.webp FA_Helmet_079_Green.webp FA_Helmet_079_Yellow.webp FA_Helmet_080_Black.webp FA_Helmet_080_Red.webp FA_Helmet_64_Blue.webp FA_Helmet_64_Brown.webp FA_Helmet_64_Green.webp".split(" ");
  const CHEST_FILES = "FA_Chest_030_Gray.webp FA_Chest_030_Green.webp FA_Chest_030_Orange.webp FA_Chest_031_Green.webp FA_Chest_031_Mint.webp FA_Chest_031_Red.webp FA_Chest_032_Blue.webp FA_Chest_032_Purple.webp FA_Chest_032_Red.webp FA_Chest_033_Blue.webp FA_Chest_033_Brown.webp FA_Chest_033_Dark.webp FA_Chest_034_Brown.webp FA_Chest_034_Dark.webp FA_Chest_034_Purple.webp FA_Chest_035_Brown.webp FA_Chest_035_Dark.webp FA_Chest_035_Green.webp FA_Chest_036_BlueGray.webp FA_Chest_036_Brown.webp FA_Chest_036_DarkGray.webp FA_Chest_037_DarkGray.webp FA_Chest_037_Grey.webp FA_Chest_037_Wine.webp FA_Chest_038_Blue.webp FA_Chest_038_Brown.webp FA_Chest_038_Gray.webp FA_Chest_039_Brown.webp FA_Chest_039_Green.webp FA_Chest_040_Blue.webp FA_Chest_040_Brown.webp FA_Chest_041_Blue.webp FA_Chest_041_Red.webp FA_Chest_041_White.webp FA_Chest_042_Blue.webp FA_Chest_042_Green.webp FA_Chest_042_Purple.webp FA_Chest_043_Blue.webp FA_Chest_043_Green.webp FA_Chest_043_Red.webp FA_Chest_044_Brown.webp FA_Chest_044_Red.webp FA_Chest_044_White.webp FA_Chest_045_BrownDark.webp FA_Chest_045_Gray.webp FA_Chest_045_Green.webp FA_Chest_046_BlueGold.webp FA_Chest_046_Gray.webp FA_Chest_046_GreenGold.webp FA_Chest_047_Brown.webp FA_Chest_047_Light.webp FA_Chest_048_Brown.webp FA_Chest_048_Dark.webp FA_Chest_048_Gray.webp FA_Chest_049_DarkGold.webp FA_Chest_049_Green.webp FA_Chest_049_PuppleGold.webp FA_Chest_050_Gold.webp FA_Chest_050_Light.webp FA_Chest_050_Red.webp FA_Chest_051_Brown.webp FA_Chest_051_Green.webp FA_Chest_052_Orange.webp FA_Chest_052_Purple.webp FA_Chest_052_Red.webp FA_Chest_053_Blue.webp FA_Chest_053_Brown.webp FA_Chest_053_Dark.webp FA_Chest_054_Gray.webp FA_Chest_054_Green.webp FA_Chest_054_Whte.webp FA_Chest_055_GrayBlue.webp FA_Chest_055_GrayRed.webp FA_Chest_055_GrayYellow.webp FA_Chest_056_Brown.webp FA_Chest_056_White.webp FA_Chest_056_Yellow.webp FA_Chest_057_Green.webp FA_Chest_057_Purple.webp FA_Chest_057_Yellow.webp FA_Chest_058_Blue.webp FA_Chest_058_Gray.webp FA_Chest_058_Purple.webp FA_Chest_059_Purple.webp FA_Chest_059_WhiteGold.webp FA_Chest_059_Yellow.webp".split(" ");
  const canvas = document.getElementById("canvas"), ctx = canvas.getContext("2d");
  const character = document.getElementById("character"), facing = document.getElementById("facing"), skinTone = document.getElementById("skinTone"), layer = document.getElementById("layer"), animation = document.getElementById("animation"), frame = document.getElementById("frame"), projectile = document.getElementById("projectile"), x = document.getElementById("x"), y = document.getElementById("y"), result = document.getElementById("result"), playPause = document.getElementById("playPause");
  const partSources = {
    body: document.getElementById("bodySource"), backLeg: document.getElementById("backLegSource"), frontLeg: document.getElementById("frontLegSource"),
  };
  const helmetSource = document.getElementById("helmetSource");
  const chestSource = document.getElementById("chestSource");
  const images = new Map();
  function defaultOffset(_characterId, partId) { return { ...defaults[partId] }; }
  const offsets = Object.fromEntries(CHARACTER_IDS.map((id) => [id, Object.fromEntries(LAYERS.map((part) => [part.id, defaultOffset(id, part.id)]))]));
  let playing = true;

  CHARACTER_IDS.forEach((id) => { const option = document.createElement("option"); option.value = id; option.textContent = id.replace("_", " "); character.append(option); });
  SKIN_TONES.forEach(([name, color]) => { const option = document.createElement("option"); option.value = color; option.textContent = name; skinTone.append(option); });
  const noHelmetOption = document.createElement("option"); noHelmetOption.value = ""; noHelmetOption.textContent = "none"; helmetSource.append(noHelmetOption);
  HELMET_FILES.forEach((file) => { const option = document.createElement("option"); option.value = file; option.textContent = file.replace("FA_Helmet_", "").replace(/\.webp$/, "").replace("_", " · "); helmetSource.append(option); });
  Object.entries(partSources).forEach(([partId, select]) => {
    if (partId === "body") { const option = document.createElement("option"); option.value = "base"; option.textContent = `base dynamic ${partId}`; select.append(option); }
    CHARACTER_IDS.forEach((id) => { const option = document.createElement("option"); option.value = id; option.textContent = id.replace("_", " "); select.append(option); });
  });
  character.value = "character_4";
  Object.values(partSources).forEach((select) => { select.value = select === partSources.body ? "base" : "character_4"; });

  function sourceFor(id, part) { return part.id === "helmet" ? `${HELMET_ROOT}/${helmetSource.value}` : part.id === "chest" ? `${CHEST_ROOT}/${chestSource.value}` : `${SOURCE_ROOT}/${id}/${part.file}`; }
  function keyFor(id, part) { return sourceFor(id, part); }
  function getImage(id, part) {
    const key = keyFor(id, part); if (images.has(key)) return images.get(key);
    const image = new Image(); image.src = sourceFor(id, part); image.addEventListener("load", draw); image.addEventListener("error", draw); images.set(key, image); return image;
  }
  function sourceCharacterFor(part) { return partSources[part.id]?.value ?? character.value; }
  function isDynamicBase(part) { return part.id === "head" || Boolean(part.kind && sourceCharacterFor(part) === "base"); }
  function sourceChoices() { return { ...Object.fromEntries(Object.entries(partSources).map(([partId, select]) => [partId, select.value || "none"])), helmet: helmetSource.value || "none", chest: chestSource.value || "none" }; }
  function setPreset(id) { Object.values(partSources).forEach((select) => { select.value = id; }); }
  function visibleLayers() { return LAYERS.filter((part) => !part.character || part.character === character.value); }
  function selectedPart() { return visibleLayers().find((part) => part.id === layer.value); }
  function populateLayers() {
    const prior = layer.value; layer.replaceChildren();
    visibleLayers().forEach((part) => { const option = document.createElement("option"); option.value = part.id; option.textContent = part.label; layer.append(option); });
    layer.value = [...layer.options].some((option) => option.value === prior) ? prior : "body";
    syncControls();
  }
  function selectedOffsets() { return offsets[character.value][layer.value]; }
  function syncControls() { const current = selectedOffsets(); x.value = current.x; y.value = current.y; document.getElementById("xValue").textContent = current.x; document.getElementById("yValue").textContent = current.y; }
  function walkOffset(part) {
    const index = Number(frame.value);
    const gait = {
      backLeg: [{ x: 0, y: 0 }, { x: 2, y: 0 }, { x: 4, y: 0 }, { x: 0, y: -3 }],
      frontLeg: [{ x: 0, y: 0 }, { x: -1, y: -3 }, { x: -4, y: 0 }, { x: 2, y: 0 }],
    };
    if (part.id in gait) return animation.value === "idle" ? { x: 0, y: 0 } : gait[part.id][index];
    if (part.motion === "head") return { x: 0, y: [0, -2, -3, -2][index] };
    return { x: 0, y: 0 };
  }
  function basePosition(part, width, height) { return { x: 90 - width / 2 + (part.baseX ?? 0), y: part.anchor === "bottom" ? part.anchorY - height : part.baseY }; }
  function roundedRect(x, y, width, height, radius) {
    ctx.beginPath(); ctx.moveTo(x + radius, y); ctx.lineTo(x + width - radius, y); ctx.quadraticCurveTo(x + width, y, x + width, y + radius); ctx.lineTo(x + width, y + height - radius); ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height); ctx.lineTo(x + radius, y + height); ctx.quadraticCurveTo(x, y + height, x, y + height - radius); ctx.lineTo(x, y + radius); ctx.quadraticCurveTo(x, y, x + radius, y); ctx.closePath();
  }
  function drawBaseBody(x, y, width, height, scale) {
    ctx.save(); ctx.translate(x * scale, y * scale); ctx.scale(scale, scale);
    const egg = (inset) => {
      const left = inset, top = inset, eggWidth = width - inset * 2, eggHeight = height - inset * 2, middle = left + eggWidth / 2;
      ctx.beginPath(); ctx.moveTo(middle, top);
      ctx.bezierCurveTo(left + eggWidth * .78, top, left + eggWidth, top + eggHeight * .2, left + eggWidth, top + eggHeight * .56);
      ctx.bezierCurveTo(left + eggWidth, top + eggHeight * .84, left + eggWidth * .74, top + eggHeight, middle, top + eggHeight);
      ctx.bezierCurveTo(left + eggWidth * .26, top + eggHeight, left, top + eggHeight * .84, left, top + eggHeight * .56);
      ctx.bezierCurveTo(left, top + eggHeight * .2, left + eggWidth * .22, top, middle, top); ctx.closePath();
    };
    ctx.fillStyle = "#000"; egg(0); ctx.fill();
    ctx.fillStyle = skinTone.value; egg(3); ctx.fill(); ctx.restore();
  }
  function drawBaseHead(x, y, width, height, scale) {
    ctx.save(); ctx.translate(x * scale, y * scale); ctx.scale(scale, scale);
    const pill = (inset) => {
      const pillWidth = width - inset * 2, pillHeight = height - inset * 2, radius = pillHeight / 2, left = inset, top = inset;
      ctx.beginPath(); ctx.moveTo(left + radius, top); ctx.lineTo(left + pillWidth - radius, top);
      ctx.arc(left + pillWidth - radius, top + radius, radius, -Math.PI / 2, Math.PI / 2);
      ctx.lineTo(left + radius, top + pillHeight); ctx.arc(left + radius, top + radius, radius, Math.PI / 2, Math.PI * 1.5); ctx.closePath();
    };
    ctx.fillStyle = "#000"; pill(0); ctx.fill();
    ctx.fillStyle = skinTone.value; pill(3.5); ctx.fill();
    ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(width * .42, height * .51, 5.7, 0, Math.PI * 2); ctx.arc(width * .77, height * .51, 5.7, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }
  function drawPart(part) {
    const current = offsets[character.value][part.id], motion = walkOffset(part), scale = 2, originX = 90, originY = 36;
    if ((part.id === "helmet" && !helmetSource.value) || (part.id === "chest" && !chestSource.value)) return;
    if (isDynamicBase(part)) {
      const base = basePosition(part, part.width, part.height), drawX = originX + base.x + current.x + motion.x, drawY = originY + base.y + current.y + motion.y;
      if (part.kind === "body") drawBaseBody(drawX, drawY, part.width, part.height, scale);
      else drawBaseHead(drawX, drawY, part.width, part.height, scale);
      return;
    }
    const image = getImage(sourceCharacterFor(part), part); if (!image.complete || !image.naturalWidth) return;
    const base = basePosition(part, image.naturalWidth, image.naturalHeight);
    ctx.drawImage(image, (originX + base.x + current.x + motion.x) * scale, (originY + base.y + current.y + motion.y) * scale, image.naturalWidth * scale, image.naturalHeight * scale);
  }
  function drawShot() {
    if (projectile.value !== "on") return;
    const held = LAYERS.find((part) => part.id === "hold"), image = getImage(character.value, held); if (!image.complete || !image.naturalWidth) return;
    const current = offsets.character_4.hold, base = basePosition(held, image.naturalWidth, image.naturalHeight), phase = Number(frame.value), scale = 2, originX = 90, originY = 36;
    ctx.drawImage(image, (originX + base.x + current.x + phase * 14) * scale, (originY + base.y + current.y) * scale, image.naturalWidth * scale, image.naturalHeight * scale);
  }
  function headAnchor() {
    const head = LAYERS.find((part) => part.id === "head"), current = offsets[character.value].head, motion = walkOffset(head), scale = 2, originX = 90, originY = 36;
    const image = isDynamicBase(head) ? null : getImage(sourceCharacterFor(head), head);
    const headWidth = image?.naturalWidth || head.width, headHeight = image?.naturalHeight || head.height, base = basePosition(head, headWidth, headHeight);
    let anchorX = (originX + 90 + current.x + motion.x) * scale;
    if (facing.value === "left") anchorX = canvas.width - anchorX;
    return { x: anchorX, y: (originY + base.y + current.y + motion.y) * scale };
  }
  function drawHeadAnchor() {
    const anchor = headAnchor();
    ctx.save(); ctx.strokeStyle = "#78f7ff"; ctx.lineWidth = 2; ctx.setLineDash([4, 3]);
    ctx.beginPath(); ctx.moveTo(anchor.x - 12, anchor.y); ctx.lineTo(anchor.x + 12, anchor.y); ctx.moveTo(anchor.x, anchor.y - 12); ctx.lineTo(anchor.x, anchor.y + 12); ctx.stroke();
    ctx.setLineDash([]); ctx.fillStyle = "#78f7ff"; ctx.fillText("helmet base", anchor.x + 15, anchor.y - 8); ctx.restore();
    return anchor;
  }
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = "#162419"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    if (facing.value === "left") { ctx.translate(canvas.width, 0); ctx.scale(-1, 1); }
    visibleLayers().forEach(drawPart); drawShot(); ctx.restore();
    const center = canvas.width / 2, ground = (36 + 170) * 2;
    ctx.strokeStyle = "rgba(255,255,255,.38)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(center, 0); ctx.lineTo(center, canvas.height); ctx.moveTo(0, ground); ctx.lineTo(canvas.width, ground); ctx.stroke();
    const helmetBase = drawHeadAnchor();
    const current = selectedOffsets(), part = selectedPart();
    result.textContent = `${character.value} · ${facing.value}\nskin: ${skinTone.options[skinTone.selectedIndex].text}\nselected: ${part?.label ?? layer.value}\noffset: x ${current.x}, y ${current.y}\nhelmet base: x ${Math.round(helmetBase.x / 2)}, y ${Math.round(helmetBase.y / 2)}\nwalk: ${frame.options[frame.selectedIndex].text}\n\n${JSON.stringify({ sources: sourceChoices(), skinTone: skinTone.value, offsets: offsets[character.value] }, null, 2)}`;
  }
  function clamp(value) { return Math.max(-100, Math.min(250, value)); }
  function update(axis, value) { selectedOffsets()[axis] = clamp(value); syncControls(); draw(); }
  character.addEventListener("input", () => { setPreset(character.value); populateLayers(); draw(); });
  Object.values(partSources).forEach((select) => select.addEventListener("input", draw));
  helmetSource.addEventListener("input", draw);
  const noChestOption = document.createElement("option"); noChestOption.value = ""; noChestOption.textContent = "none"; chestSource.append(noChestOption);
  CHEST_FILES.forEach((file) => { const option = document.createElement("option"); option.value = file; option.textContent = file.replace("FA_Chest_", "").replace(/\.webp$/, "").replace("_", " · "); chestSource.append(option); });
  chestSource.addEventListener("input", draw);
  [facing, skinTone, frame, projectile].forEach((control) => control.addEventListener("input", draw));
  animation.addEventListener("input", draw);
  layer.addEventListener("input", () => { syncControls(); draw(); });
  x.addEventListener("input", () => update("x", Number(x.value))); y.addEventListener("input", () => update("y", Number(y.value)));
  canvas.addEventListener("keydown", (event) => { const amount = event.shiftKey ? 5 : 1, directions = { ArrowLeft: [-amount, 0], ArrowRight: [amount, 0], ArrowUp: [0, -amount], ArrowDown: [0, amount] }, nudge = directions[event.key]; if (!nudge) return; event.preventDefault(); update("x", selectedOffsets().x + nudge[0]); update("y", selectedOffsets().y + nudge[1]); });
  playPause.addEventListener("click", () => { playing = !playing; playPause.textContent = playing ? "pause walk" : "play walk"; playPause.setAttribute("aria-pressed", String(playing)); });
  document.getElementById("resetLayer").addEventListener("click", () => { const part = selectedPart(); offsets[character.value][part.id] = defaultOffset(character.value, part.id); syncControls(); draw(); });
  document.getElementById("copy").addEventListener("click", async () => { await navigator.clipboard.writeText(JSON.stringify({ character: character.value, sources: sourceChoices(), skinTone: skinTone.value, offsets: offsets[character.value] }, null, 2)); });
  window.setInterval(() => {
    if (!playing) return;
    const firstFrame = animation.value === "idle" ? 0 : 1;
    frame.value = String(Number(frame.value) >= 3 || Number(frame.value) < firstFrame ? firstFrame : Number(frame.value) + 1);
    draw();
  }, 500);
  populateLayers(); draw();
</script>
</body>
